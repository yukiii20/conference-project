services:
  - type: web
    name: conference-cms-backend
    runtime: node
    rootDir: server
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # --- Database (Aiven) - values from the Aiven console, see docs/aiven-mysql-setup.md ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_POOL_SIZE
        value: 10
      - key: DB_SSL
        value: true
      - key: DB_SSL_CA
        sync: false

      # --- Session / CORS - CLIENT_ORIGIN and APP_URL are the final Vercel URL ---
      - key: SESSION_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: APP_URL
        sync: false

      # Exactly one proxy hop (Render's own) sits in front of this service -
      # Vercel's rewrite forwards the original connection rather than adding
      # a hop of its own. See src/app.ts's parseTrustProxySetting.
      - key: TRUST_PROXY
        value: "1"

      # --- Email - brevo works on Render's free plan (smtp needs a paid plan: free
      # services block outbound SMTP ports 25/465/587) - see docs/deploy-guide.md ---
      - key: EMAIL_MODE
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # --- Uploaded files: Cloudflare R2 (the free plan's own disk is wiped on every
      # deploy/restart). See docs/cloudflare-r2-setup.md. ---
      # Set to r2 in the Render dashboard only AFTER the four R2_* values are filled in
      # (the server refuses to start with STORAGE_DRIVER=r2 and missing R2 settings).
      - key: STORAGE_DRIVER
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
