<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="shared.css" />
    <style>
      .card {
        width: 1100px;
        background: #fff;
        border-radius: 28px;
        box-shadow: 0 30px 80px rgba(114, 47, 55, 0.25);
        padding: 64px 80px;
        text-align: center;
        opacity: 0;
        transform: translateY(24px) scale(0.97);
        animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .title {
        font-size: 54px;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 44px;
      }
      .circle {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--cream);
        opacity: 0;
        transform: scale(0.5) rotate(-15deg);
        animation: iconIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
      }
      .circle svg {
        width: 72px;
        height: 72px;
        stroke: var(--burgundy);
        fill: none;
        stroke-width: 2.2;
      }
      .label {
        margin-top: 24px;
        font-size: 22px;
        color: var(--burgundy);
        font-weight: 600;
        opacity: 0;
        animation: rise 0.4s ease-out 0.85s forwards;
      }
      @keyframes cardIn {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes iconIn {
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }
      @keyframes rise {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="card">
        <div class="title">Certificates in one click</div>
        <div class="circle">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="5" />
            <path d="M8.5 12.5 7 21l5-3 5 3-1.5-8.5" />
          </svg>
        </div>
        <div class="label">Generate &rarr; Release</div>
      </div>
    </div>
  </body>
</html>
